name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Tailwind deps
        run: |
          npm init -y
          npm install --save-dev tailwindcss @tailwindcss/cli
          npm list tailwindcss @tailwindcss/cli  # Verify install

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.152.2'
          extended: true

      - name: Build Hugo
        run: hugo --minify --logLevel debug
        env:
          HUGO_ENV: production

      - name: Check public/ output (fail if missing/empty)
        run: |
          if [ ! -d public ] || [ -z "$(ls -A public)" ]; then
            echo "ERROR: public/ missing or empty — Hugo didn't generate the site!"
            echo "Review the Hugo build logs above for clues (e.g., Tailwind errors, config issues, no content)."
            exit 1
          fi
          ls -la public/
          if [ ! -f public/index.html ]; then
            echo "ERROR: index.html not found in public/!"
            exit 1
          fi
          echo "index.html found ✓ (size: $(du -h public/index.html | cut -f1))"
          head -n 5 public/index.html

      - name: Deploy to Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_MUD_0035E4B0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "public"
          output_location: ""
          skip_app_build: true
          skip_api_build: true

  close_pr:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_MUD_0035E4B0F }}
          action: "close"